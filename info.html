<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Info</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
/* ================= BLOCCO SELEZIONE ================= */
*{
 -webkit-user-select:none;
 -moz-user-select:none;
 -ms-user-select:none;
 user-select:none;
 cursor:default;
}

/* ================= VARIABILI ================= */
:root{
 --bg:black;
 --text:white;
 --bar:#1f1f1f;
 --accent:#00eaff;
}
body.light{
 --bg:#f2f2f2;
 --text:#00252b;
 --bar:#ffffff;
}

/* ================= BASE ================= */
body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Poppins,sans-serif;
 overflow:hidden;
}

/* ================= TOPBAR ================= */
.topbar{
 position:fixed;
 top:0;
 width:100%;
 height:70px;
 background:var(--bar);
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 25px;
 z-index:1000;
 box-shadow:0 4px 15px rgba(0,0,0,.5);
}
.logo{height:40px;cursor:pointer}

/* ================= AVATAR ================= */
.avatar{
 width:40px;height:40px;
 border-radius:50%;
 border:2px solid var(--accent);
 object-fit:cover;
 cursor:pointer;
}

/* ================= MENU PROFILO ================= */
.profile-menu{
 display:none;
 position:fixed;
 top:70px;right:60px;
 width:270px;
 background:var(--bar);
 border:2px solid var(--accent);
 border-radius:14px;
 padding:12px;
 box-shadow:0 8px 20px rgba(0,0,0,.6);
 z-index:2000;
}
.profile-menu.show{display:block}
.profile-menu div{
 padding:10px;
 border-radius:8px;
 cursor:pointer;
}
.profile-menu div:hover{
 background:rgba(0,180,204,.3);
}
.profile-menu .email{
 font-size:13px;
 opacity:.8;
 cursor:default;
}
.profile-menu label{
 font-size:12px;
 opacity:.8;
}
.profile-menu select{
 width:100%;
 margin-top:5px;
 padding:6px;
 border-radius:8px;
 border:1px solid var(--accent);
 background:rgba(255,255,255,.1);
 color:var(--text);
}
.profile-menu hr{
 border:1px solid var(--accent);
 opacity:.3;
 margin:10px 0;
}

/* ================= TITOLI DI CODA ================= */
.credits{
 position:absolute;
 bottom:-140%;
 width:100%;
 text-align:center;
 animation:scroll 55s linear infinite;
 padding-top:120px;
}
.credits h1{
 margin:50px 0 10px;
 font-size:30px;
 color:var(--accent);
}
.credits p{
 margin:6px 0;
 font-size:18px;
 opacity:.9;
}
@keyframes scroll{
 from{bottom:-140%}
 to{bottom:140%}
}

/* ================= MUSICA ================= */
.music-btn{
 position:fixed;
 bottom:20px;
 right:20px;
 background:#00b5cc;
 color:#00252b;
 padding:12px 22px;
 border-radius:25px;
 font-weight:600;
 cursor:pointer;
 box-shadow:0 0 15px var(--accent);
 z-index:1500;
}
.music-btn:hover{background:var(--accent)}
</style>
</head>

<body>

<!-- ================= TOPBAR ================= -->
<header class="topbar">
 <a href="index.html">
  <img src="scorpion.logo-removebg-preview.png" class="logo">
 </a>

 <img id="avatar" class="avatar" src="https://via.placeholder.com/40">
 <div id="profileMenu" class="profile-menu"></div>
</header>

<!-- ================= AUDIO ================= -->
<audio id="bgMusic">
 <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<!-- ================= CREDITI ================= -->
<div class="credits" id="credits"></div>

<!-- ================= MUSICA BTN ================= -->
<div class="music-btn" id="musicBtn">▶️ Avvia musica</div>

<!-- ================= SCRIPT ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getAuth,onAuthStateChanged,signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

/* FIREBASE */
const firebaseConfig={
 apiKey:"AIzaSyDyhMkXCr8AEEGggeakUET6xlW9JG92hDQ",
 authDomain:"fisica-rispetto-del-corpo.firebaseapp.com",
 projectId:"fisica-rispetto-del-corpo",
 appId:"1:1018600887176:web:6712b714cb7ec9ca8b203d"
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);

/* STATO */
let lang=localStorage.getItem("lang")||"it";
let theme=localStorage.getItem("theme")||"dark";

/* ELEMENTI */
const avatar=document.getElementById("avatar");
const menu=document.getElementById("profileMenu");
const credits=document.getElementById("credits");
const music=document.getElementById("bgMusic");
const btn=document.getElementById("musicBtn");

/* TEMA */
document.body.classList.toggle("light",theme==="light");

/* CONTENUTI */
const content={
it:`
 <h1>Rispetto del Corpo</h1>
 <p>Progetto di Educazione Civica</p>

 <h1>Origine del progetto</h1>
 <p>
  Questo progetto è nato come attività di<br>
  <strong>Educazione Civica</strong>,<br>
  dedicata al rispetto del nostro corpo<br>
  e alla consapevolezza personale.
 </p>

 <h1>Istituto</h1>
 <p>
  Istituto Leon Battista Alberti<br>
  Roma
 </p>

 <h1>Classe</h1>
 <p>2ª A CAT</p>

 <h1>Sviluppo</h1>
 <p>
  Realizzato come progetto scolastico<br>
  con l'obiettivo di sensibilizzare<br>
  al benessere fisico ed emotivo.
 </p>

 <h1>Developer</h1>
 <p>FantasyDamy</p>

 <h1>Organizzazione</h1>
 <p>Scorpion&Studio's</p>

 <h1>Contatti</h1>
 <p>fantasydamy@gmail.com</p>

 <p style="margin-top:80px">
  © 2025 – Progetto di Educazione Civica
 </p>
`
,
 en:`
  <h1>Body Respect</h1>
  <p>A project dedicated to self-respect</p>

  <h1>Developer</h1>
  <p>FantasyDamy</p>

  <h1>Organizer</h1>
  <p>Scorpion&Studio's</p>

  <h1>Why it was created</h1>
  <p>
   Promote body respect,<br>
   physical and emotional well-being,<br>
   and personal awareness.
  </p>

  <h1>Contacts</h1>
  <p>fantasydamy@gmail.com</p>

  <p style="margin-top:80px">© 2025 Scorpion&Studio's</p>
 `
};
credits.innerHTML=content[lang];

/* MENU */
avatar.onclick=e=>{
 e.stopPropagation();
 menu.classList.toggle("show");
};
document.onclick=()=>menu.classList.remove("show");
menu.onclick=e=>e.stopPropagation();

/* AUTH */
onAuthStateChanged(auth,user=>{
 if(user){
  if(user.photoURL) avatar.src=user.photoURL;
  menu.innerHTML=menuHTML(user.email,true);
 }else{
  avatar.src="https://via.placeholder.com/40";
  menu.innerHTML=menuHTML("",false);
 }
 initControls();
});

/* HTML MENU */
function menuHTML(email,logged){
 return`
 ${logged?`
  <div class="email">${email}</div>
  <div onclick="goDashboard()">Dashboard</div>
  <div onclick="logout()">Logout</div>
 `:`<div onclick="goLogin()">Login</div>`}
 <hr>
 <label>Lingua</label>
 <select id="langSel">
  <option value="it">Italiano</option>
  <option value="en">English</option>
 </select>
 <label>Tema</label>
 <select id="themeSel">
  <option value="dark">Scuro</option>
  <option value="light">Chiaro</option>
 </select>
 `;
}

/* CONTROLLI */
function initControls(){
 document.getElementById("langSel").value=lang;
 document.getElementById("themeSel").value=theme;

 document.getElementById("langSel").onchange=e=>{
  lang=e.target.value;
  localStorage.setItem("lang",lang);
  credits.innerHTML=content[lang];
 };

 document.getElementById("themeSel").onchange=e=>{
  theme=e.target.value;
  localStorage.setItem("theme",theme);
  document.body.classList.toggle("light",theme==="light");
 };
}

/* NAV */
window.goLogin=()=>location.href="login-staff.html";
window.goDashboard=()=>location.href="dashboard.html";
window.logout=()=>signOut(auth).then(()=>location.reload());

/* MUSICA */
let playing=false;
btn.onclick=async()=>{
 if(!playing){
  await music.play();
  btn.innerText="⏸️ Ferma musica";
 }else{
  music.pause();
  btn.innerText="▶️ Avvia musica";
 }
 playing=!playing;
};
</script>

<!-- ================= BLOCCO ANTI-COPIA JS ================= -->
<script>
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("keydown",e=>{
 if(
  e.ctrlKey && ["c","v","x","u","s","p"].includes(e.key.toLowerCase())
 ) e.preventDefault();

 if(
  e.key==="F12" ||
  (e.ctrlKey && e.shiftKey && ["i","j"].includes(e.key.toLowerCase()))
 ) e.preventDefault();
});
</script>

</body>
</html>
